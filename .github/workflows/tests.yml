name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-interpret:
    # No GPU on hosted runners: kernels run in the Triton interpreter on small shapes.
    # Full-size GPU tests and benchmarks run on H200 (see results/).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch, pinned)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
          pip install triton==3.5.0 pytest==8.3.3 numpy==2.1.3
          pip install -e . --no-deps
      - name: Tests (TRITON_INTERPRET=1)
        env:
          TRITON_INTERPRET: "1"
        run: pytest -q
